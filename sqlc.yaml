version: "2"
sql:
  - name: ""
    engine: "mysql"
    queries: 
      - "./internal/adapters/mysql/sqlc/queries/"
    schema: 
      - "./internal/adapters/mysql/migrations/grieflogger"
      - "./internal/adapters/mysql/migrations/ledger"
      - "./internal/adapters/mysql/migrations/luckperms"
      - "./internal/adapters/mysql/migrations/psmpstats"
    gen:
      go:
        package: "repo"
        out: "./internal/adapters/mysql/sqlc"
        emit_json_tags: true
        emit_interface: true # Generate Querier interface